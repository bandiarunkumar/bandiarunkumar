<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="860" height="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Path Line Gradient -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#ffa657"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="860" height="160" rx="14" fill="url(#pbg)"/>
  <rect x="0.5" y="0.5" width="859" height="159" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="32" fill="#8b949e" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    ⚡ END-TO-END DATA ANALYTICS PIPELINE
  </text>

  <!-- Connection Line -->
  <path d="M 110,85 L 750,85" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="6,6" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- Animated Glowing Flowing Dots -->
  <circle cx="110" cy="85" r="4" fill="#58a6ff" filter="url(#glow)">
    <animate attributeName="cx" values="110;270;430;590;750" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="fill" values="#58a6ff;#22d3ee;#39d353;#ffa657;#a371f7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="110" cy="85" r="4" fill="#39d353" filter="url(#glow)">
    <animate attributeName="cx" values="110;270;430;590;750" begin="1.5s" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="fill" values="#58a6ff;#22d3ee;#39d353;#ffa657;#a371f7" begin="1.5s" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 1: Raw Data -->
  <g transform="translate(110, 85)">
    <circle cx="0" cy="0" r="28" fill="#161b22" stroke="#58a6ff" stroke-width="2">
      <animate attributeName="stroke-width" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" fill="#e6edf3" font-size="16" text-anchor="middle">📥</text>
    <text x="0" y="14" fill="#58a6ff" font-size="10" font-weight="700" text-anchor="middle">RAW DATA</text>
    <text x="0" y="44" fill="#7d8590" font-size="9" text-anchor="middle">CSV / APIs</text>
  </g>

  <!-- Node 2: Processing -->
  <g transform="translate(270, 85)">
    <circle cx="0" cy="0" r="28" fill="#161b22" stroke="#22d3ee" stroke-width="2">
      <animate attributeName="stroke-width" values="2;4;2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" fill="#e6edf3" font-size="16" text-anchor="middle">⚙️</text>
    <text x="0" y="14" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle">CLEANING</text>
    <text x="0" y="44" fill="#7d8590" font-size="9" text-anchor="middle">Pandas / NumPy</text>
  </g>

  <!-- Node 3: Storage & SQL -->
  <g transform="translate(430, 85)">
    <circle cx="0" cy="0" r="28" fill="#161b22" stroke="#39d353" stroke-width="2">
      <animate attributeName="stroke-width" values="2;4;2" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" fill="#e6edf3" font-size="16" text-anchor="middle">🗄️</text>
    <text x="0" y="14" fill="#39d353" font-size="10" font-weight="700" text-anchor="middle">WAREHOUSE</text>
    <text x="0" y="44" fill="#7d8590" font-size="9" text-anchor="middle">PostgreSQL / SQL</text>
  </g>

  <!-- Node 4: ML & Modeling -->
  <g transform="translate(590, 85)">
    <circle cx="0" cy="0" r="28" fill="#161b22" stroke="#ffa657" stroke-width="2">
      <animate attributeName="stroke-width" values="2;4;2" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" fill="#e6edf3" font-size="16" text-anchor="middle">🧠</text>
    <text x="0" y="14" fill="#ffa657" font-size="10" font-weight="700" text-anchor="middle">MODELING</text>
    <text x="0" y="44" fill="#7d8590" font-size="9" text-anchor="middle">Scikit-Learn / ML</text>
  </g>

  <!-- Node 5: Dashboard Insights -->
  <g transform="translate(750, 85)">
    <circle cx="0" cy="0" r="28" fill="#161b22" stroke="#a371f7" stroke-width="2">
      <animate attributeName="stroke-width" values="2;4;2" dur="2s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-4" fill="#e6edf3" font-size="16" text-anchor="middle">📊</text>
    <text x="0" y="14" fill="#a371f7" font-size="10" font-weight="700" text-anchor="middle">INSIGHTS</text>
    <text x="0" y="44" fill="#7d8590" font-size="9" text-anchor="middle">Tableau / Dashboards</text>
  </g>
</svg>
