<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="860" height="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- © 2026 Bandi Arunkumar (https://github.com/bandiarunkumar). All Rights Reserved. -->
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Morphing Color Gradient -->
    <linearGradient id="morphGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="mglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="860" height="180" rx="14" fill="url(#mbg)"/>
  <rect x="0.5" y="0.5" width="859" height="179" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="30" fill="#8b949e" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">
    🌀 FLUID MORPHING DATA ENGINE
  </text>

  <!-- Left Side: Morphing Organic Vector Blob (Center at 220, 105) -->
  <g transform="translate(220, 105)">
    <!-- Ambient Morphing Path -->
    <path fill="url(#morphGrad)" opacity="0.85" filter="url(#mglow)">
      <animate attributeName="d"
        dur="8s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
        values="
          M 0 -45 C 30 -45, 50 -25, 45 0 C 40 30, 25 45, 0 45 C -25 45, -45 25, -45 0 C -45 -30, -30 -45, 0 -45 Z;
          M 0 -50 C 45 -30, 30 35, 0 45 C -35 50, -45 -10, -35 -35 C -25 -50, -20 -40, 0 -50 Z;
          M 0 -40 C 25 -55, 55 -15, 40 15 C 25 45, -30 40, -45 10 C -55 -20, -25 -25, 0 -40 Z;
          M 0 -45 C 30 -45, 50 -25, 45 0 C 40 30, 25 45, 0 45 C -25 45, -45 25, -45 0 C -45 -30, -30 -45, 0 -45 Z
        "/>
    </path>
    <!-- Center Core Icon -->
    <circle cx="0" cy="0" r="14" fill="#0d1117" stroke="#e6edf3" stroke-width="2"/>
    <text x="0" y="4" fill="#39d353" font-size="10" font-weight="900" text-anchor="middle">⚙️</text>
  </g>

  <!-- Divider -->
  <line x1="380" y1="45" x2="380" y2="155" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right Side: Text & Morphing Status Engine -->
  <g transform="translate(420, 75)">
    <text x="0" y="0" fill="#7d8590" font-size="11" font-weight="700">CURRENT ENGINE STATE:</text>
    
    <!-- Morphing Status Text -->
    <text x="0" y="32" fill="#58a6ff" font-size="22" font-weight="800" filter="url(#mglow)">
      <tspan opacity="1">
        <animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.22;0.75;0.95;1" dur="8s" repeatCount="indefinite"/>
        ⚡ REAL-TIME ETL PIPELINE
      </tspan>
      <tspan x="0" y="32" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0.25;0.47;0.52;1" dur="8s" repeatCount="indefinite"/>
        🧠 PREDICTIVE ML MODELING
      </tspan>
      <tspan x="0" y="32" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0.55;0.72;0.95;1" dur="8s" repeatCount="indefinite"/>
        📊 EXECUTIVE DASHBOARDS
      </tspan>
    </text>

    <text x="0" y="60" fill="#39d353" font-size="12" font-weight="700">
      ● Morphing Vector Paths Active &amp; Processing Data...
    </text>
  </g>
</svg>
