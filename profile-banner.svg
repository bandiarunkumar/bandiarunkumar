<svg xmlns="http://www.w3.org/2000/svg" width="860" height="140" viewBox="0 0 860 140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0d2040"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="30%" stop-color="#58a6ff"/>
      <stop offset="70%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="140" rx="16" fill="url(#bg)"/>

  <!-- Animated border glow -->
  <rect x="1" y="1" width="858" height="138" rx="15" fill="none" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative grid dots -->
  <g fill="#58a6ff" fill-opacity="0.06">
    <rect x="20" y="20" width="2" height="2" rx="1"/>
    <rect x="40" y="20" width="2" height="2" rx="1"/>
    <rect x="60" y="20" width="2" height="2" rx="1"/>
    <rect x="820" y="20" width="2" height="2" rx="1"/>
    <rect x="840" y="20" width="2" height="2" rx="1"/>
    <rect x="20" y="118" width="2" height="2" rx="1"/>
    <rect x="840" y="118" width="2" height="2" rx="1"/>
  </g>

  <!-- Left accent bar -->
  <rect x="28" y="35" width="3" height="70" rx="2" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;1;0.6" begin="0.2s" dur="0.6s" fill="freeze"/>
  </rect>

  <!-- Name -->
  <text x="52" y="68" fill="#e6edf3" font-size="32" font-weight="700" opacity="0" letter-spacing="-0.5" filter="url(#glow)">
    Bandia Arunkumar
    <animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.7s" fill="freeze"/>
  </text>

  <!-- Blue-green gradient underline -->
  <rect x="52" y="74" width="0" height="2" rx="1" fill="url(#line)">
    <animate attributeName="width" from="0" to="340" begin="0.9s" dur="0.6s" fill="freeze"/>
  </rect>

  <!-- Tagline -->
  <text x="52" y="100" fill="#7d8590" font-size="14" opacity="0">
    Data Analyst  ·  Python Developer  ·  Open Source Contributor  ·  India 🇮🇳
    <animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.5s" fill="freeze"/>
  </text>

  <!-- Right side: animated data particles -->
  <g opacity="0.5">
    <circle cx="720" cy="45" r="2" fill="#39d353">
      <animate attributeName="cy" values="45;35;45" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="745" cy="60" r="1.5" fill="#58a6ff">
      <animate attributeName="cy" values="60;50;60" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="40" r="2.5" fill="#ffa657">
      <animate attributeName="cy" values="40;55;40" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="795" cy="70" r="1.5" fill="#39d353">
      <animate attributeName="cy" values="70;55;70" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="50" r="2" fill="#58a6ff">
      <animate attributeName="cy" values="50;65;50" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Bar chart decoration -->
    <rect x="710" y="90" width="8" height="20" rx="2" fill="#006d32" opacity="0.7"/>
    <rect x="724" y="82" width="8" height="28" rx="2" fill="#26a641" opacity="0.7"/>
    <rect x="738" y="75" width="8" height="35" rx="2" fill="#39d353" opacity="0.7"/>
    <rect x="752" y="85" width="8" height="25" rx="2" fill="#26a641" opacity="0.7"/>
    <rect x="766" y="78" width="8" height="32" rx="2" fill="#39d353" opacity="0.7"/>
    <rect x="780" y="88" width="8" height="22" rx="2" fill="#006d32" opacity="0.7"/>
    <rect x="794" y="72" width="8" height="38" rx="2" fill="#39d353" opacity="0.7"/>
    <rect x="808" y="80" width="8" height="30" rx="2" fill="#26a641" opacity="0.7"/>
    <rect x="822" y="85" width="8" height="25" rx="2" fill="#0e4429" opacity="0.7"/>
    <rect x="836" y="76" width="8" height="34" rx="2" fill="#39d353" opacity="0.7"/>
  </g>
</svg>
