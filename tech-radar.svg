<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- © 2026 Bandia Arunkumar (https://github.com/bandiarunkumar). All Rights Reserved. Unauthorized copying prohibited. -->
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="rglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="260" rx="14" fill="url(#rbg)"/>
  <rect x="0.5" y="0.5" width="859" height="259" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="30" fill="#8b949e" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">
    🪐 TECH RADAR &amp; ORBITING STACK
  </text>

  <!-- Center Origin (430, 140) -->

  <!-- Inner Orbit Ring -->
  <circle cx="430" cy="140" r="55" fill="none" stroke="#58a6ff" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Outer Orbit Ring -->
  <circle cx="430" cy="140" r="100" fill="none" stroke="#39d353" stroke-dasharray="6,6" opacity="0.25"/>

  <!-- Core Center Badge -->
  <circle cx="430" cy="140" r="28" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#rglow)"/>
  <text x="430" y="136" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">DATA</text>
  <text x="430" y="149" fill="#58a6ff" font-size="10" font-weight="700" text-anchor="middle">ANALYST</text>

  <!-- INNER ORBIT NODES (Clockwise) -->
  <g transform="translate(430, 140)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <!-- Python (at 0 deg) -->
      <circle cx="55" cy="0" r="14" fill="#161b22" stroke="#3776AB" stroke-width="2"/>
      <text x="55" y="4" fill="#3776AB" font-size="10" font-weight="700" text-anchor="middle">Py</text>

      <!-- SQL (at 120 deg) -->
      <circle cx="-27.5" cy="47.6" r="14" fill="#161b22" stroke="#4479A1" stroke-width="2"/>
      <text x="-27.5" y="51.6" fill="#4479A1" font-size="10" font-weight="700" text-anchor="middle">SQL</text>

      <!-- Pandas (at 240 deg) -->
      <circle cx="-27.5" cy="-47.6" r="14" fill="#161b22" stroke="#150458" stroke-width="2"/>
      <text x="-27.5" y="-43.6" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle">Pd</text>
    </g>
  </g>

  <!-- OUTER ORBIT NODES (Counter-Clockwise) -->
  <g transform="translate(430, 140)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      <!-- PostgreSQL (at 0 deg) -->
      <circle cx="100" cy="0" r="15" fill="#161b22" stroke="#4169E1" stroke-width="2"/>
      <text x="100" y="4" fill="#4169E1" font-size="9" font-weight="700" text-anchor="middle">PG</text>

      <!-- Tableau (at 90 deg) -->
      <circle cx="0" cy="100" r="15" fill="#161b22" stroke="#E97627" stroke-width="2"/>
      <text x="0" y="104" fill="#E97627" font-size="9" font-weight="700" text-anchor="middle">Tab</text>

      <!-- Docker (at 180 deg) -->
      <circle cx="-100" cy="0" r="15" fill="#161b22" stroke="#0db7ed" stroke-width="2"/>
      <text x="-100" y="4" fill="#0db7ed" font-size="9" font-weight="700" text-anchor="middle">Doc</text>

      <!-- Git (at 270 deg) -->
      <circle cx="0" cy="-100" r="15" fill="#161b22" stroke="#F05032" stroke-width="2"/>
      <text x="0" y="-96" fill="#F05032" font-size="9" font-weight="700" text-anchor="middle">Git</text>
    </g>
  </g>
</svg>
