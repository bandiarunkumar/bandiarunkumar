<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 140" width="860" height="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- © 2026 Bandia Arunkumar (https://github.com/bandiarunkumar). All Rights Reserved. Unauthorized copying prohibited. -->
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a0e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39d353" stop-opacity="1"/>
      <stop offset="50%" stop-color="#26a641" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#006d32" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="860" height="140" rx="12" fill="url(#mbg)"/>
  <rect x="0.5" y="0.5" width="859" height="139" rx="12" fill="none" stroke="#26a641" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Matrix Columns -->
  <!-- Col 1 -->
  <text x="40" y="0" fill="#39d353" font-size="12" opacity="0.8">
    <tspan x="40" dy="14">1</tspan><tspan x="40" dy="14">0</tspan><tspan x="40" dy="14">P</tspan><tspan x="40" dy="14">Y</tspan><tspan x="40" dy="14">1</tspan>
    <animate attributeName="y" values="-60;140" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
  </text>

  <!-- Col 2 -->
  <text x="110" y="0" fill="#00ff66" font-size="12" opacity="0.9">
    <tspan x="110" dy="14">S</tspan><tspan x="110" dy="14">Q</tspan><tspan x="110" dy="14">L</tspan><tspan x="110" dy="14">1</tspan><tspan x="110" dy="14">0</tspan>
    <animate attributeName="y" values="-60;140" begin="0.7s" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" begin="0.7s" dur="1.8s" repeatCount="indefinite"/>
  </text>

  <!-- Col 3 -->
  <text x="180" y="0" fill="#39d353" font-size="12" opacity="0.8">
    <tspan x="180" dy="14">D</tspan><tspan x="180" dy="14">A</tspan><tspan x="180" dy="14">T</tspan><tspan x="180" dy="14">A</tspan><tspan x="180" dy="14">1</tspan>
    <animate attributeName="y" values="-60;140" begin="0.3s" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" begin="0.3s" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- Col 4 -->
  <text x="250" y="0" fill="#39d353" font-size="12" opacity="0.8">
    <tspan x="250" dy="14">0</tspan><tspan x="250" dy="14">1</tspan><tspan x="250" dy="14">0</tspan><tspan x="250" dy="14">1</tspan><tspan x="250" dy="14">0</tspan>
    <animate attributeName="y" values="-60;140" begin="1.1s" dur="2.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" begin="1.1s" dur="2.0s" repeatCount="indefinite"/>
  </text>

  <!-- Center Overlay Text -->
  <rect x="230" y="45" width="400" height="50" rx="8" fill="#0d1117" fill-opacity="0.85" stroke="#39d353" stroke-width="1"/>
  <text x="430" y="75" fill="#39d353" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">
    &gt; SYSTEM_ONLINE: DATA_ANALYST
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </text>

  <!-- Right side columns -->
  <!-- Col 5 -->
  <text x="610" y="0" fill="#39d353" font-size="12" opacity="0.8">
    <tspan x="610" dy="14">M</tspan><tspan x="610" dy="14">L</tspan><tspan x="610" dy="14">1</tspan><tspan x="610" dy="14">0</tspan><tspan x="610" dy="14">1</tspan>
    <animate attributeName="y" values="-60;140" begin="0.5s" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" begin="0.5s" dur="2.1s" repeatCount="indefinite"/>
  </text>

  <!-- Col 6 -->
  <text x="680" y="0" fill="#00ff66" font-size="12" opacity="0.9">
    <tspan x="680" dy="14">0</tspan><tspan x="680" dy="14">1</tspan><tspan x="680" dy="14">A</tspan><tspan x="680" dy="14">I</tspan><tspan x="680" dy="14">0</tspan>
    <animate attributeName="y" values="-60;140" begin="1.3s" dur="1.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" begin="1.3s" dur="1.9s" repeatCount="indefinite"/>
  </text>

  <!-- Col 7 -->
  <text x="750" y="0" fill="#39d353" font-size="12" opacity="0.8">
    <tspan x="750" dy="14">F</tspan><tspan x="750" dy="14">A</tspan><tspan x="750" dy="14">S</tspan><tspan x="750" dy="14">T</tspan><tspan x="750" dy="14">1</tspan>
    <animate attributeName="y" values="-60;140" begin="0.2s" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" begin="0.2s" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- Col 8 -->
  <text x="810" y="0" fill="#39d353" font-size="12" opacity="0.8">
    <tspan x="810" dy="14">1</tspan><tspan x="810" dy="14">0</tspan><tspan x="810" dy="14">1</tspan><tspan x="810" dy="14">0</tspan><tspan x="810" dy="14">1</tspan>
    <animate attributeName="y" values="-60;140" begin="0.9s" dur="2.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" begin="0.9s" dur="2.0s" repeatCount="indefinite"/>
  </text>
</svg>
