<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" width="860" height="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="pwbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="860" height="120" rx="12" fill="url(#pwbg)"/>
  <rect x="0.5" y="0.5" width="859" height="119" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Retro Grid Floor -->
  <line x1="20" y1="95" x2="840" y2="95" stroke="#39d353" stroke-width="2" opacity="0.6"/>

  <!-- Floating Coins / Stars along path -->
  <g>
    <!-- Coin 1 -->
    <circle cx="200" cy="70" r="8" fill="#ffa657">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="200" y="74" fill="#0d1117" font-size="10" font-weight="900" text-anchor="middle">★</text>

    <!-- Coin 2 -->
    <circle cx="400" cy="70" r="8" fill="#39d353">
      <animate attributeName="opacity" values="1;0.2;1" begin="0.3s" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="400" y="74" fill="#0d1117" font-size="10" font-weight="900" text-anchor="middle">★</text>

    <!-- Coin 3 -->
    <circle cx="600" cy="70" r="8" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0.2;1" begin="0.6s" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="74" fill="#0d1117" font-size="10" font-weight="900" text-anchor="middle">★</text>
  </g>

  <!-- Walking Developer Sprite (Animated Translate across X-axis) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="20,0;800,0;20,0" dur="10s" repeatCount="indefinite" calcMode="linear"/>

    <!-- Bobbing body movement -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="0.4s" repeatCount="indefinite"/>

      <!-- Head -->
      <rect x="-10" y="45" width="20" height="20" rx="4" fill="#58a6ff"/>
      <!-- Glasses -->
      <rect x="-6" y="51" width="5" height="4" fill="#0d1117"/>
      <rect x="1" y="51" width="5" height="4" fill="#0d1117"/>
      <!-- Body -->
      <rect x="-8" y="66" width="16" height="18" rx="3" fill="#39d353"/>
      <!-- Left Arm -->
      <rect x="-13" y="68" width="4" height="12" fill="#58a6ff"/>
      <!-- Right Arm -->
      <rect x="9" y="68" width="4" height="12" fill="#58a6ff"/>
      <!-- Left Leg -->
      <rect x="-7" y="84" width="5" height="11" fill="#ffa657"/>
      <!-- Right Leg -->
      <rect x="2" y="84" width="5" height="11" fill="#ffa657"/>
    </g>
  </g>

  <!-- Level Banner Text -->
  <text x="430" y="32" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    🕹️ LEVEL 2026: DATA ANALYST ON THE MOVE
  </text>
</svg>
