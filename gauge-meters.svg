<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="860" height="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="860" height="170" rx="14" fill="url(#gbg)"/>
  <rect x="0.5" y="0.5" width="859" height="169" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="28" fill="#8b949e" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    🎛️ ANALYTICS SPEEDOMETERS &amp; METRICS
  </text>

  <!-- Gauge 1: Data Cleaning (135, 100) -->
  <g transform="translate(135, 100)">
    <!-- Arc Background -->
    <path d="M -40 0 A 40 40 0 1 1 40 0" fill="none" stroke="#21262d" stroke-width="8" stroke-linecap="round"/>
    <!-- Animated Arc Fill -->
    <path d="M -40 0 A 40 40 0 1 1 40 0" fill="none" stroke="#39d353" stroke-width="8" stroke-linecap="round" stroke-dasharray="126" stroke-dashoffset="126">
      <animate attributeName="stroke-dashoffset" from="126" to="15" dur="2s" fill="freeze"/>
    </path>
    <!-- Needle -->
    <line x1="0" y1="0" x2="-26" y2="-26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="-90" to="65" dur="2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </line>
    <circle cx="0" cy="0" r="5" fill="#39d353"/>
    <text x="0" y="22" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">Data Prep</text>
    <text x="0" y="38" fill="#39d353" font-size="12" font-weight="700" text-anchor="middle">95%</text>
  </g>

  <!-- Gauge 2: SQL Querying (330, 100) -->
  <g transform="translate(330, 100)">
    <path d="M -40 0 A 40 40 0 1 1 40 0" fill="none" stroke="#21262d" stroke-width="8" stroke-linecap="round"/>
    <path d="M -40 0 A 40 40 0 1 1 40 0" fill="none" stroke="#58a6ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="126" stroke-dashoffset="126">
      <animate attributeName="stroke-dashoffset" from="126" to="25" dur="2s" begin="0.3s" fill="freeze"/>
    </path>
    <line x1="0" y1="0" x2="-26" y2="-26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="-90" to="50" dur="2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </line>
    <circle cx="0" cy="0" r="5" fill="#58a6ff"/>
    <text x="0" y="22" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">SQL Query</text>
    <text x="0" y="38" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">88%</text>
  </g>

  <!-- Gauge 3: Data Viz & Tableau (525, 100) -->
  <g transform="translate(525, 100)">
    <path d="M -40 0 A 40 40 0 1 1 40 0" fill="none" stroke="#21262d" stroke-width="8" stroke-linecap="round"/>
    <path d="M -40 0 A 40 40 0 1 1 40 0" fill="none" stroke="#ffa657" stroke-width="8" stroke-linecap="round" stroke-dasharray="126" stroke-dashoffset="126">
      <animate attributeName="stroke-dashoffset" from="126" to="35" dur="2s" begin="0.6s" fill="freeze"/>
    </path>
    <line x1="0" y1="0" x2="-26" y2="-26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="-90" to="35" dur="2s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </line>
    <circle cx="0" cy="0" r="5" fill="#ffa657"/>
    <text x="0" y="22" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">Tableau/Viz</text>
    <text x="0" y="38" fill="#ffa657" font-size="12" font-weight="700" text-anchor="middle">82%</text>
  </g>

  <!-- Gauge 4: Machine Learning (720, 100) -->
  <g transform="translate(720, 100)">
    <path d="M -40 0 A 40 40 0 1 1 40 0" fill="none" stroke="#21262d" stroke-width="8" stroke-linecap="round"/>
    <path d="M -40 0 A 40 40 0 1 1 40 0" fill="none" stroke="#a371f7" stroke-width="8" stroke-linecap="round" stroke-dasharray="126" stroke-dashoffset="126">
      <animate attributeName="stroke-dashoffset" from="126" to="48" dur="2s" begin="0.9s" fill="freeze"/>
    </path>
    <line x1="0" y1="0" x2="-26" y2="-26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="-90" to="20" dur="2s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </line>
    <circle cx="0" cy="0" r="5" fill="#a371f7"/>
    <text x="0" y="22" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">ML Modeling</text>
    <text x="0" y="38" fill="#a371f7" font-size="12" font-weight="700" text-anchor="middle">75%</text>
  </g>
</svg>
