<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 140" width="860" height="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- © 2026 Bandia Arunkumar (https://github.com/bandiarunkumar). All Rights Reserved. Unauthorized copying prohibited. -->
  <defs>
    <linearGradient id="pcbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#121d2d"/>
      <stop offset="100%" stop-color="#0c1017"/>
    </linearGradient>
    <filter id="pcglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="140" rx="14" fill="url(#pcbg)"/>
  <rect x="0.5" y="0.5" width="859" height="139" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="30" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">
    🎆 DYNAMIC PARTICLE CONSTELLATION &amp; DATA MESH
  </text>

  <!-- Constellation Connecting Lines -->
  <g stroke="#58a6ff" stroke-width="1" opacity="0.4">
    <line x1="120" y1="70" x2="250" y2="50">
      <animate attributeName="y1" values="70;90;70" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="50;40;50" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="50" x2="410" y2="80">
      <animate attributeName="y1" values="50;40;50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="80;95;80" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="410" y1="80" x2="580" y2="55">
      <animate attributeName="y1" values="80;95;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="55;70;55" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="580" y1="55" x2="740" y2="85">
      <animate attributeName="y1" values="55;70;55" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="85;65;85" dur="4.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Floating Particle Nodes -->
  <circle cx="120" cy="70" r="5" fill="#58a6ff" filter="url(#pcglow)">
    <animate attributeName="cy" values="70;90;70" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="110" fill="#58a6ff" font-size="10" font-weight="700" text-anchor="middle">Data Sources</text>

  <circle cx="250" cy="50" r="6" fill="#39d353" filter="url(#pcglow)">
    <animate attributeName="cy" values="50;40;50" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="250" y="110" fill="#39d353" font-size="10" font-weight="700" text-anchor="middle">ETL Engine</text>

  <circle cx="410" cy="80" r="7" fill="#ffa657" filter="url(#pcglow)">
    <animate attributeName="cy" values="80;95;80" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="410" y="115" fill="#ffa657" font-size="10" font-weight="700" text-anchor="middle">Data Warehouse</text>

  <circle cx="580" cy="55" r="6" fill="#22d3ee" filter="url(#pcglow)">
    <animate attributeName="cy" values="55;70;55" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <text x="580" y="110" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle">ML Models</text>

  <circle cx="740" cy="85" r="5" fill="#a371f7" filter="url(#pcglow)">
    <animate attributeName="cy" values="85;65;85" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <text x="740" y="110" fill="#a371f7" font-size="10" font-weight="700" text-anchor="middle">BI Dashboards</text>
</svg>
