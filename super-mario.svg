<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="860" height="170" font-family="'Courier New', Courier, monospace">
  <!-- © 2026 Bandi Arunkumar (https://github.com/bandiarunkumar). All Rights Reserved. -->

  <!-- ═══ SKY BACKGROUND ═══ -->
  <rect width="860" height="170" fill="#5c94fc"/>

  <!-- ═══ HUD BAR ═══ -->
  <rect width="860" height="22" fill="#000000" opacity="0.6"/>
  <text x="24" y="8" fill="white" font-size="8" font-weight="bold">MARIO</text>
  <text x="24" y="19" fill="white" font-size="9">006400</text>
  <text x="240" y="14" fill="#FFD700" font-size="9" font-weight="bold">&#9733; x 03</text>
  <text x="375" y="8" fill="white" font-size="8" font-weight="bold">WORLD</text>
  <text x="380" y="19" fill="white" font-size="9">1 - 1</text>
  <text x="610" y="8" fill="white" font-size="8" font-weight="bold">TIME</text>
  <text x="612" y="19" fill="white" font-size="9"> 388</text>

  <!-- ═══ CLOUDS ═══ -->
  <!-- Cloud 1 (slow drift leftward) -->
  <g fill="white">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-860 0" dur="28s" repeatCount="indefinite" calcMode="linear"/>
      <rect x="100" y="32" width="64" height="18" rx="9"/>
      <rect x="86" y="40" width="92" height="18" rx="9"/>
      <!-- cloud 1 clone offset for seamless loop -->
      <rect x="960" y="32" width="64" height="18" rx="9"/>
      <rect x="946" y="40" width="92" height="18" rx="9"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-860 0" dur="38s" repeatCount="indefinite" calcMode="linear"/>
      <rect x="640" y="36" width="50" height="14" rx="7"/>
      <rect x="628" y="42" width="74" height="16" rx="8"/>
      <rect x="1500" y="36" width="50" height="14" rx="7"/>
      <rect x="1488" y="42" width="74" height="16" rx="8"/>
    </g>
  </g>

  <!-- ═══ HILLS (decorative) ═══ -->
  <ellipse cx="60" cy="145" rx="58" ry="16" fill="#40a030" opacity="0.55"/>
  <ellipse cx="68" cy="145" rx="34" ry="12" fill="#50c040" opacity="0.4"/>
  <ellipse cx="810" cy="145" rx="50" ry="14" fill="#40a030" opacity="0.55"/>
  <ellipse cx="816" cy="145" rx="28" ry="10" fill="#50c040" opacity="0.4"/>

  <!-- ═══ QUESTION MARK BLOCKS ═══ -->
  <!-- Block 1 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.4s" repeatCount="indefinite" begin="0s"/>
    <rect x="280" y="78" width="26" height="26" fill="#c84c0c"/>
    <rect x="282" y="80" width="22" height="22" fill="#e8a800"/>
    <rect x="283" y="81" width="20" height="20" fill="#f5c000"/>
    <!-- highlight top-left -->
    <rect x="283" y="81" width="20" height="3" fill="#f8d840" opacity="0.7"/>
    <rect x="283" y="81" width="3" height="20" fill="#f8d840" opacity="0.7"/>
    <!-- ? -->
    <text x="293" y="97" fill="#7c3800" font-size="14" font-weight="900" text-anchor="middle">?</text>
  </g>

  <!-- Block 2 (center - active bounce + coin) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.4s" repeatCount="indefinite" begin="0.5s"/>
    <rect x="318" y="78" width="26" height="26" fill="#c84c0c"/>
    <rect x="320" y="80" width="22" height="22" fill="#e8a800"/>
    <rect x="321" y="81" width="20" height="20" fill="#f5c000"/>
    <rect x="321" y="81" width="20" height="3" fill="#f8d840" opacity="0.7"/>
    <rect x="321" y="81" width="3" height="20" fill="#f8d840" opacity="0.7"/>
    <text x="331" y="97" fill="#7c3800" font-size="14" font-weight="900" text-anchor="middle">?</text>
  </g>

  <!-- Block 3 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.4s" repeatCount="indefinite" begin="1.0s"/>
    <rect x="356" y="78" width="26" height="26" fill="#c84c0c"/>
    <rect x="358" y="80" width="22" height="22" fill="#e8a800"/>
    <rect x="359" y="81" width="20" height="20" fill="#f5c000"/>
    <rect x="359" y="81" width="20" height="3" fill="#f8d840" opacity="0.7"/>
    <rect x="359" y="81" width="3" height="20" fill="#f8d840" opacity="0.7"/>
    <text x="369" y="97" fill="#7c3800" font-size="14" font-weight="900" text-anchor="middle">?</text>
  </g>

  <!-- ═══ COIN (popping from block 2) ═══ -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.4;0.7;1" dur="1.4s" begin="0.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -30;0 -30;0 0" keyTimes="0;0.3;0.6;0.7;1" dur="1.4s" begin="0.5s" repeatCount="indefinite"/>
    <!-- Coin body -->
    <circle cx="331" cy="68" r="8" fill="#f5c000" stroke="#e8a800" stroke-width="1.5"/>
    <ellipse cx="331" cy="68" rx="3" ry="7" fill="#f8d840" opacity="0.7"/>
    <!-- Coin shine -->
    <circle cx="328" cy="65" r="2" fill="white" opacity="0.6"/>
  </g>

  <!-- ═══ TALL PIPE (x=590) ═══ -->
  <g>
    <!-- pipe body -->
    <rect x="592" y="104" width="38" height="38" fill="#309030"/>
    <rect x="594" y="104" width="9" height="38" fill="#40b840"/>
    <rect x="624" y="104" width="3" height="38" fill="#206020" opacity="0.4"/>
    <!-- pipe cap -->
    <rect x="587" y="97" width="48" height="13" fill="#309030"/>
    <rect x="589" y="97" width="9" height="13" fill="#40b840"/>
    <rect x="629" y="97" width="3" height="13" fill="#206020" opacity="0.4"/>
    <!-- pipe outlines -->
    <rect x="587" y="97" width="48" height="13" fill="none" stroke="#206020" stroke-width="1.5"/>
    <rect x="592" y="104" width="38" height="38" fill="none" stroke="#206020" stroke-width="1"/>
  </g>

  <!-- ═══ SHORT PIPE (x=720) ═══ -->
  <g>
    <rect x="722" y="116" width="34" height="26" fill="#309030"/>
    <rect x="724" y="116" width="8" height="26" fill="#40b840"/>
    <rect x="750" y="116" width="3" height="26" fill="#206020" opacity="0.4"/>
    <rect x="717" y="109" width="44" height="12" fill="#309030"/>
    <rect x="719" y="109" width="8" height="12" fill="#40b840"/>
    <rect x="754" y="109" width="3" height="12" fill="#206020" opacity="0.4"/>
    <rect x="717" y="109" width="44" height="12" fill="none" stroke="#206020" stroke-width="1.5"/>
    <rect x="722" y="116" width="34" height="26" fill="none" stroke="#206020" stroke-width="1"/>
  </g>

  <!-- ═══ FLOATING BRICK PLATFORM ═══ -->
  <!-- 4 bricks in a row at x=450, y=96 -->
  <rect x="450" y="96" width="24" height="20" fill="#c84c0c"/>
  <rect x="476" y="96" width="24" height="20" fill="#c84c0c"/>
  <rect x="502" y="96" width="24" height="20" fill="#c84c0c"/>
  <rect x="528" y="96" width="24" height="20" fill="#c84c0c"/>
  <!-- brick cracks (decorative lines) -->
  <line x1="474" y1="96" x2="474" y2="116" stroke="#9a3800" stroke-width="2"/>
  <line x1="500" y1="96" x2="500" y2="116" stroke="#9a3800" stroke-width="2"/>
  <line x1="526" y1="96" x2="526" y2="116" stroke="#9a3800" stroke-width="2"/>
  <line x1="552" y1="96" x2="552" y2="116" stroke="#9a3800" stroke-width="2"/>
  <line x1="450" y1="106" x2="474" y2="106" stroke="#9a3800" stroke-width="1.5"/>
  <line x1="476" y1="106" x2="500" y2="106" stroke="#9a3800" stroke-width="1.5"/>
  <line x1="502" y1="106" x2="526" y2="106" stroke="#9a3800" stroke-width="1.5"/>
  <line x1="528" y1="106" x2="552" y2="106" stroke="#9a3800" stroke-width="1.5"/>
  <!-- highlight on bricks -->
  <rect x="450" y="96" width="24" height="3" fill="#e86a30" opacity="0.5"/>
  <rect x="476" y="96" width="24" height="3" fill="#e86a30" opacity="0.5"/>
  <rect x="502" y="96" width="24" height="3" fill="#e86a30" opacity="0.5"/>
  <rect x="528" y="96" width="24" height="3" fill="#e86a30" opacity="0.5"/>

  <!-- ═══ GROUND ═══ -->
  <!-- Grass strip -->
  <rect y="140" width="860" height="6" fill="#52a236"/>
  <!-- Green highlight -->
  <rect y="140" width="860" height="2" fill="#70d450" opacity="0.5"/>
  <!-- Dirt base -->
  <rect y="146" width="860" height="24" fill="#c84c0c"/>
  <!-- Brick grid: horizontal divider -->
  <line x1="0" y1="155" x2="860" y2="155" stroke="#9a3800" stroke-width="1.5" opacity="0.7"/>
  <!-- Top row vertical lines (every 40px) -->
  <line x1="40" y1="146" x2="40" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="80" y1="146" x2="80" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="120" y1="146" x2="120" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="146" x2="160" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="146" x2="200" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="240" y1="146" x2="240" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="280" y1="146" x2="280" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="320" y1="146" x2="320" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="146" x2="360" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="146" x2="400" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="440" y1="146" x2="440" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="480" y1="146" x2="480" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="520" y1="146" x2="520" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="560" y1="146" x2="560" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="640" y1="146" x2="640" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="680" y1="146" x2="680" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="760" y1="146" x2="760" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="800" y1="146" x2="800" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="840" y1="146" x2="840" y2="155" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <!-- Bottom row vertical lines (offset by 20px) -->
  <line x1="20" y1="155" x2="20" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="155" x2="60" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="155" x2="100" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="155" x2="140" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="180" y1="155" x2="180" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="220" y1="155" x2="220" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="155" x2="260" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="300" y1="155" x2="300" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="340" y1="155" x2="340" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="380" y1="155" x2="380" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="420" y1="155" x2="420" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="460" y1="155" x2="460" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="500" y1="155" x2="500" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="540" y1="155" x2="540" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="580" y1="155" x2="580" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="620" y1="155" x2="620" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="660" y1="155" x2="660" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="700" y1="155" x2="700" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="740" y1="155" x2="740" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="780" y1="155" x2="780" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <line x1="820" y1="155" x2="820" y2="170" stroke="#9a3800" stroke-width="1" opacity="0.5"/>
  <!-- Ground highlight (top edge) -->
  <rect y="146" width="860" height="2" fill="#e86a30" opacity="0.3"/>

  <!-- ═══ MARIO PIXEL ART (running left → right, looping) ═══ -->
  <!--
    Pixel size P = 3. Sprite: 12 cols × 16 rows = 36 × 48 SVG units.
    Ground top at y=140. Mario feet at y=140. Mario top at y=140-48=92.
    Bounce: alternates y between 92 and 84 (-8 jump).
    Colors: R=#e52521 (red), S=#f5a840 (skin), B=#7c3800 (brown), U=#1a6aff (blue), W=#ffffff
  -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-50 92; 90 84; 200 92; 330 84; 450 92; 570 84; 680 92; 800 84; 900 92; 950 92"
      keyTimes="0; 0.111; 0.222; 0.333; 0.444; 0.556; 0.667; 0.778; 0.889; 1"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
      dur="9s" repeatCount="indefinite"/>

    <!-- Row 0: hat top (cols 4–7) -->
    <rect x="12" y="0"  width="12" height="3" fill="#e52521"/>
    <!-- Row 1–2: hat brim (cols 3–8) -->
    <rect x="9"  y="3"  width="18" height="6" fill="#e52521"/>
    <!-- Row 3: hair + skin  (cols 3,4=B | 5,6=S | 7,8=B) -->
    <rect x="9"  y="9"  width="6"  height="3" fill="#7c3800"/>
    <rect x="15" y="9"  width="6"  height="3" fill="#f5a840"/>
    <rect x="21" y="9"  width="6"  height="3" fill="#7c3800"/>
    <!-- Row 4: face (col 2=B | 3–8=S | col 9=B) -->
    <rect x="6"  y="12" width="3"  height="3" fill="#7c3800"/>
    <rect x="9"  y="12" width="18" height="3" fill="#f5a840"/>
    <rect x="27" y="12" width="3"  height="3" fill="#7c3800"/>
    <!-- Row 5: full face (cols 2–9 = S) -->
    <rect x="6"  y="15" width="24" height="3" fill="#f5a840"/>
    <!-- Row 6: eyes (col2=S | col3=W | cols4–7=S | col8=W | col9=S) -->
    <rect x="6"  y="18" width="3"  height="3" fill="#f5a840"/>
    <rect x="9"  y="18" width="3"  height="3" fill="#ffffff"/>
    <rect x="12" y="18" width="12" height="3" fill="#f5a840"/>
    <rect x="24" y="18" width="3"  height="3" fill="#ffffff"/>
    <rect x="27" y="18" width="3"  height="3" fill="#f5a840"/>
    <!-- Row 7: lower face (cols 2–9 = S) -->
    <rect x="6"  y="21" width="24" height="3" fill="#f5a840"/>
    <!-- Row 8: mustache (cols 3–8 = B) -->
    <rect x="9"  y="24" width="18" height="3" fill="#7c3800"/>
    <!-- Row 9: shirt + overalls (cols 1,2=R | 3–7=U | 8,9=R) -->
    <rect x="3"  y="27" width="6"  height="3" fill="#e52521"/>
    <rect x="9"  y="27" width="15" height="3" fill="#1a6aff"/>
    <rect x="24" y="27" width="6"  height="3" fill="#e52521"/>
    <!-- Row 10: body (cols 0–3=R | 4–6=U | 7–10=R) -->
    <rect x="0"  y="30" width="12" height="3" fill="#e52521"/>
    <rect x="12" y="30" width="9"  height="3" fill="#1a6aff"/>
    <rect x="21" y="30" width="12" height="3" fill="#e52521"/>
    <!-- Row 11: full body row (cols 0–10 = R) -->
    <rect x="0"  y="33" width="33" height="3" fill="#e52521"/>
    <!-- Row 12: two legs (cols 1,2=R  and  8,9=R) -->
    <rect x="3"  y="36" width="6"  height="3" fill="#e52521"/>
    <rect x="24" y="36" width="6"  height="3" fill="#e52521"/>
    <!-- Row 13: upper shoes (cols 1,2=B and 8,9=B) -->
    <rect x="3"  y="39" width="6"  height="3" fill="#7c3800"/>
    <rect x="24" y="39" width="6"  height="3" fill="#7c3800"/>
    <!-- Row 14: wider shoes (cols 1–3=B and 7–9=B) -->
    <rect x="3"  y="42" width="9"  height="3" fill="#7c3800"/>
    <rect x="21" y="42" width="9"  height="3" fill="#7c3800"/>
    <!-- Row 15: shoe base (cols 0–2=B and 7–10=B) -->
    <rect x="0"  y="45" width="9"  height="3" fill="#7c3800"/>
    <rect x="21" y="45" width="12" height="3" fill="#7c3800"/>
  </g>

</svg>
