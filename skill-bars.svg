<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190" viewBox="0 0 860 190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- © 2026 Bandia Arunkumar (https://github.com/bandiarunkumar). All Rights Reserved. Unauthorized copying prohibited. -->
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="860" height="190" rx="12" fill="url(#pbg)"/>
  <rect x="0.5" y="0.5" width="859" height="189" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Python -->
  <text x="24" y="40" fill="#ffa657" font-size="12" font-weight="700">Python</text>
  <rect x="130" y="27" width="700" height="14" rx="7" fill="#161b22"/>
  <rect x="130" y="27" width="0" height="14" rx="7" fill="#39d353">
    <animate attributeName="width" from="0" to="630" begin="0.3s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="842" y="40" fill="#7d8590" font-size="11" text-anchor="end">90%</text>

  <!-- SQL -->
  <text x="24" y="75" fill="#ffa657" font-size="12" font-weight="700">SQL</text>
  <rect x="130" y="62" width="700" height="14" rx="7" fill="#161b22"/>
  <rect x="130" y="62" width="0" height="14" rx="7" fill="#58a6ff">
    <animate attributeName="width" from="0" to="560" begin="0.5s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="842" y="75" fill="#7d8590" font-size="11" text-anchor="end">80%</text>

  <!-- Data Analysis -->
  <text x="24" y="110" fill="#ffa657" font-size="12" font-weight="700">Data Analysis</text>
  <rect x="130" y="97" width="700" height="14" rx="7" fill="#161b22"/>
  <rect x="130" y="97" width="0" height="14" rx="7" fill="#22d3ee">
    <animate attributeName="width" from="0" to="525" begin="0.7s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="842" y="110" fill="#7d8590" font-size="11" text-anchor="end">75%</text>

  <!-- JavaScript -->
  <text x="24" y="145" fill="#ffa657" font-size="12" font-weight="700">JavaScript</text>
  <rect x="130" y="132" width="700" height="14" rx="7" fill="#161b22"/>
  <rect x="130" y="132" width="0" height="14" rx="7" fill="#f2cc60">
    <animate attributeName="width" from="0" to="490" begin="0.9s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="842" y="145" fill="#7d8590" font-size="11" text-anchor="end">70%</text>

  <!-- ML / AI -->
  <text x="24" y="180" fill="#ffa657" font-size="12" font-weight="700">ML / AI</text>
  <rect x="130" y="167" width="700" height="14" rx="7" fill="#161b22"/>
  <rect x="130" y="167" width="0" height="14" rx="7" fill="#a371f7">
    <animate attributeName="width" from="0" to="420" begin="1.1s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="842" y="180" fill="#7d8590" font-size="11" text-anchor="end">60%</text>
</svg>
