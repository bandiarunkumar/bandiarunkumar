<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="860" height="210" rx="12" fill="url(#pbg)"/>
  <rect x="0.5" y="0.5" width="859" height="209" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="36" fill="#c9d1d9" font-size="13" font-weight="700" text-anchor="middle">⚡ Skill Proficiency</text>
  <line x1="24" y1="46" x2="836" y2="46" stroke="#30363d" stroke-width="1"/>

  <!-- Skill rows: label, bar background, animated bar, percentage -->
  <!-- Python -->
  <text x="24" y="73" fill="#ffa657" font-size="12" font-weight="700">Python</text>
  <rect x="130" y="60" width="650" height="14" rx="7" fill="#161b22"/>
  <rect x="130" y="60" width="0" height="14" rx="7" fill="#39d353">
    <animate attributeName="width" from="0" to="585" begin="0.3s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="792" y="73" fill="#7d8590" font-size="11" text-anchor="end">90%</text>

  <!-- SQL -->
  <text x="24" y="103" fill="#ffa657" font-size="12" font-weight="700">SQL</text>
  <rect x="130" y="90" width="650" height="14" rx="7" fill="#161b22"/>
  <rect x="130" y="90" width="0" height="14" rx="7" fill="#58a6ff">
    <animate attributeName="width" from="0" to="520" begin="0.5s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="792" y="103" fill="#7d8590" font-size="11" text-anchor="end">80%</text>

  <!-- Data Analysis -->
  <text x="24" y="133" fill="#ffa657" font-size="12" font-weight="700">Data Analysis</text>
  <rect x="130" y="120" width="650" height="14" rx="7" fill="#161b22"/>
  <rect x="130" y="120" width="0" height="14" rx="7" fill="#22d3ee">
    <animate attributeName="width" from="0" to="487" begin="0.7s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="792" y="133" fill="#7d8590" font-size="11" text-anchor="end">75%</text>

  <!-- JavaScript -->
  <text x="24" y="163" fill="#ffa657" font-size="12" font-weight="700">JavaScript</text>
  <rect x="130" y="150" width="650" height="14" rx="7" fill="#161b22"/>
  <rect x="130" y="150" width="0" height="14" rx="7" fill="#f2cc60">
    <animate attributeName="width" from="0" to="455" begin="0.9s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="792" y="163" fill="#7d8590" font-size="11" text-anchor="end">70%</text>

  <!-- Machine Learning -->
  <text x="24" y="193" fill="#ffa657" font-size="12" font-weight="700">ML / AI</text>
  <rect x="130" y="180" width="650" height="14" rx="7" fill="#161b22"/>
  <rect x="130" y="180" width="0" height="14" rx="7" fill="#a371f7">
    <animate attributeName="width" from="0" to="390" begin="1.1s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="792" y="193" fill="#7d8590" font-size="11" text-anchor="end">60%</text>
</svg>
