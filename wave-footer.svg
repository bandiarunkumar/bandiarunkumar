<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" width="860" height="120">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="35%" stop-color="#006d32"/>
      <stop offset="65%" stop-color="#0d2040"/>
      <stop offset="100%" stop-color="#0d1117"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Wave 1 (back) -->
  <path opacity="0.15" fill="#58a6ff">
    <animate attributeName="d"
      dur="7s" repeatCount="indefinite"
      values="
        M0,60 C150,20 300,100 430,60 C560,20 710,100 860,60 L860,120 L0,120 Z;
        M0,60 C150,100 300,20 430,60 C560,100 710,20 860,60 L860,120 L0,120 Z;
        M0,60 C150,20 300,100 430,60 C560,20 710,100 860,60 L860,120 L0,120 Z"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </path>

  <!-- Wave 2 (mid) -->
  <path opacity="0.2" fill="#39d353">
    <animate attributeName="d"
      dur="5s" repeatCount="indefinite"
      values="
        M0,75 C120,40 240,110 430,75 C620,40 740,110 860,75 L860,120 L0,120 Z;
        M0,75 C120,110 240,40 430,75 C620,110 740,40 860,75 L860,120 L0,120 Z;
        M0,75 C120,40 240,110 430,75 C620,40 740,110 860,75 L860,120 L0,120 Z"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </path>

  <!-- Wave 3 (front) -->
  <path opacity="0.35" fill="url(#wg)">
    <animate attributeName="d"
      dur="3.5s" repeatCount="indefinite"
      values="
        M0,88 C180,60 360,115 540,88 C720,60 800,115 860,88 L860,120 L0,120 Z;
        M0,88 C180,115 360,60 540,88 C720,115 800,60 860,88 L860,120 L0,120 Z;
        M0,88 C180,60 360,115 540,88 C720,60 800,115 860,88 L860,120 L0,120 Z"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </path>

  <!-- Solid base -->
  <rect x="0" y="108" width="860" height="12" fill="#0d1117"/>
</svg>
