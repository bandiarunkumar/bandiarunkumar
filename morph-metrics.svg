<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="860" height="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- © 2026 Bandi Arunkumar (https://github.com/bandiarunkumar). All Rights Reserved. -->
  <defs>
    <linearGradient id="mmbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffa657"/>
      <stop offset="50%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <filter id="mmglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="170" rx="14" fill="url(#mmbg)"/>
  <rect x="0.5" y="0.5" width="859" height="169" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="28" fill="#8b949e" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">
    📈 MORPHING ANALYTICS WAVE &amp; METRICS
  </text>

  <!-- Left Side: Morphing Wave Curve (Center at 220, 100) -->
  <g transform="translate(60, 100)">
    <path fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" filter="url(#mmglow)">
      <animate attributeName="d"
        dur="5s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
        values="
          M 0 0 Q 70 -45, 140 0 T 280 0;
          M 0 0 Q 70 45, 140 0 T 280 0;
          M 0 -20 Q 70 -50, 140 -10 T 280 -40;
          M 0 0 Q 70 -45, 140 0 T 280 0
        "/>
    </path>
  </g>

  <!-- Divider -->
  <line x1="380" y1="40" x2="380" y2="150" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right Side: Morphing Metrics Text -->
  <g transform="translate(420, 75)">
    <text x="0" y="0" fill="#7d8590" font-size="11" font-weight="700">SYSTEM BENCHMARKS:</text>
    
    <!-- Morphing Metric Text -->
    <text x="0" y="35" fill="#ffa657" font-size="24" font-weight="900" filter="url(#mmglow)">
      <tspan opacity="1">
        <animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.22;0.75;0.95;1" dur="7s" repeatCount="indefinite"/>
        ⚡ 99.9% PIPELINE UPTIME
      </tspan>
      <tspan x="0" y="35" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0.25;0.47;0.52;1" dur="7s" repeatCount="indefinite"/>
        📥 1.25M+ ROWS PROCESSED
      </tspan>
      <tspan x="0" y="35" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0.55;0.72;0.95;1" dur="7s" repeatCount="indefinite"/>
        🚀 &lt;0.4s QUERY LATENCY
      </tspan>
    </text>

    <text x="0" y="62" fill="#39d353" font-size="12" font-weight="700">
      ● Spline Waveform Morphing Active 🟢
    </text>
  </g>
</svg>
