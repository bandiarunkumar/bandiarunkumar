<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 140" width="860" height="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="cglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="140" rx="14" fill="url(#cbg)"/>
  <rect x="0.5" y="0.5" width="859" height="139" rx="14" fill="none" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Title -->
  <text x="430" y="30" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">
    ⚡ HIGH-SPEED DATA PROCESSING CIRCUIT
  </text>

  <!-- Circuit Traces -->
  <path d="M 40,70 L 150,70 L 200,45 L 350,45 L 400,70 L 550,70 L 600,95 L 750,95 L 820,70" fill="none" stroke="#21262d" stroke-width="3"/>
  <path d="M 40,70 L 150,70 L 200,45 L 350,45 L 400,70 L 550,70 L 600,95 L 750,95 L 820,70" fill="none" stroke="#58a6ff" stroke-width="3" stroke-dasharray="20,180" opacity="0.9" filter="url(#cglow)">
    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="2s" repeatCount="indefinite"/>
  </path>

  <path d="M 40,100 L 180,100 L 230,115 L 420,115 L 480,90 L 650,90 L 710,70 L 820,70" fill="none" stroke="#21262d" stroke-width="3"/>
  <path d="M 40,100 L 180,100 L 230,115 L 420,115 L 480,90 L 650,90 L 710,70 L 820,70" fill="none" stroke="#39d353" stroke-width="3" stroke-dasharray="20,180" opacity="0.9" filter="url(#cglow)">
    <animate attributeName="stroke-dashoffset" from="200" to="0" begin="0.5s" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <!-- Circuit Nodes -->
  <circle cx="150" cy="70" r="5" fill="#58a6ff" filter="url(#cglow)"/>
  <circle cx="350" cy="45" r="5" fill="#39d353" filter="url(#cglow)"/>
  <circle cx="550" cy="70" r="5" fill="#ffa657" filter="url(#cglow)"/>
  <circle cx="750" cy="95" r="5" fill="#a371f7" filter="url(#cglow)"/>

  <!-- Status Text Boxes -->
  <g transform="translate(180, 45)">
    <rect x="-40" y="-14" width="80" height="22" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="0" y="2" fill="#58a6ff" font-size="10" font-weight="700" text-anchor="middle">INGESTION</text>
  </g>

  <g transform="translate(400, 70)">
    <rect x="-40" y="-14" width="80" height="22" rx="4" fill="#161b22" stroke="#39d353" stroke-width="1"/>
    <text x="0" y="2" fill="#39d353" font-size="10" font-weight="700" text-anchor="middle">TRANSFORM</text>
  </g>

  <g transform="translate(600, 95)">
    <rect x="-40" y="-14" width="80" height="22" rx="4" fill="#161b22" stroke="#ffa657" stroke-width="1"/>
    <text x="0" y="2" fill="#ffa657" font-size="10" font-weight="700" text-anchor="middle">ANALYTICS</text>
  </g>
</svg>
