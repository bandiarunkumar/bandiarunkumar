<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="860" height="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- © 2026 Bandia Arunkumar (https://github.com/bandiarunkumar). All Rights Reserved. Unauthorized copying prohibited. -->
  <defs>
    <linearGradient id="lgbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>
    <filter id="lglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="160" rx="14" fill="url(#lgbg)"/>
  <rect x="0.5" y="0.5" width="859" height="159" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="28" fill="#8b949e" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    📉 REAL-TIME PERFORMANCE &amp; GROWTH TICKER
  </text>

  <!-- Grid Lines -->
  <line x1="50" y1="50" x2="810" y2="50" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50" y1="85" x2="810" y2="85" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50" y1="120" x2="810" y2="120" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Area Fill under curve -->
  <path d="M 50,110 L 150,75 L 250,95 L 350,55 L 450,70 L 550,40 L 650,60 L 750,35 L 810,45 L 810,130 L 50,130 Z" fill="url(#areaGrad)"/>

  <!-- Animated Drawing Line -->
  <path d="M 50,110 L 150,75 L 250,95 L 350,55 L 450,70 L 550,40 L 650,60 L 750,35 L 810,45" fill="none" stroke="#39d353" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1000" stroke-dashoffset="1000" filter="url(#lglow)">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </path>

  <!-- Animated Pulsing Data Points -->
  <circle cx="150" cy="75" r="4" fill="#58a6ff"/>
  <circle cx="350" cy="55" r="4" fill="#58a6ff"/>
  <circle cx="550" cy="40" r="4" fill="#39d353" filter="url(#lglow)">
    <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="35" r="5" fill="#ffa657" filter="url(#lglow)">
    <animate attributeName="r" values="5;8;5" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Legend Text -->
  <text x="60" y="145" fill="#58a6ff" font-size="10" font-weight="700">Q1: +45%</text>
  <text x="360" y="145" fill="#39d353" font-size="10" font-weight="700">Q2: +78%</text>
  <text x="660" y="145" fill="#ffa657" font-size="10" font-weight="700">Q3: +120% ALL-TIME HIGH</text>
</svg>
