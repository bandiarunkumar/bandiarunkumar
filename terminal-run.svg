<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="860" height="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="860" height="170" rx="12" fill="url(#tbg)"/>
  <rect x="0.5" y="0.5" width="859" height="169" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Window Header -->
  <rect width="860" height="32" rx="12" fill="#21262d"/>
  <rect y="20" width="860" height="12" fill="#21262d"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="16" r="6" fill="#27c93f"/>
  <text x="430" y="20" fill="#8b949e" font-size="11" font-weight="700" text-anchor="middle">bandiarunkumar@github: ~/data-pipeline</text>

  <!-- Terminal Content Lines (Animated Opacity / Reveal) -->
  <text x="24" y="55" fill="#39d353" font-size="12" font-weight="700">
    bandiarunkumar@github ~ $ ./run_data_pipeline.sh --mode=production
  </text>

  <g font-size="11">
    <!-- Line 1 -->
    <text x="24" y="78" fill="#58a6ff" opacity="0">
      [00:01] 📥 Ingesting raw dataset from PostgreSQL... [SUCCESS: 1,250,000 rows]
      <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- Line 2 -->
    <text x="24" y="98" fill="#22d3ee" opacity="0">
      [00:02] ⚙️ Cleaning missing values &amp; normalizing features via Pandas... [DONE]
      <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- Line 3 -->
    <text x="24" y="118" fill="#ffa657" opacity="0">
      [00:04] 🧠 Executing Predictive Analytics &amp; Clustering Model... [ACCURACY: 94.8%]
      <animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- Line 4 -->
    <text x="24" y="138" fill="#39d353" font-size="12" font-weight="700" opacity="0">
      [00:05] 🚀 Pipeline execution complete! Dashboard synced with Tableau. 🟢
      <animate attributeName="opacity" values="0;1" begin="2.1s" dur="0.4s" fill="freeze"/>
    </text>
  </g>

  <!-- Blinking Cursor -->
  <rect x="610" y="126" width="8" height="14" fill="#39d353">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
